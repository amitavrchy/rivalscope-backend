name: Keep Render Awake
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping RivalScope API health
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          URL="$HEALTH_URL"
          if [ -z "$URL" ]; then
            echo "Set RENDER_HEALTH_URL to an ownership-verified endpoint"
            exit 1
          fi
          echo "Pinging $URL"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 30 "$URL" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json || true
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after retries"
          exit 1